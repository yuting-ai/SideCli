<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Simplified app icon for 16 px and 32 px outputs: no motion lines or panel
       hairline (they turn to mush), larger panel and heavier prompt. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B313B"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#body)">
    <rect x="400" y="190" width="640" height="644" rx="64" fill="#434A57"/>
  </g>
  <path d="M510 392 L640 512 L510 632" fill="none" stroke="#FFB547" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="690" y="584" width="160" height="62" rx="31" fill="#FFB547"/>
</svg>
