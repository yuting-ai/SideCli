<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Menu bar template icon (18 pt). Only alpha matters: macOS tints it to the
       menu bar. A window whose right side is a filled panel with a ›_ cut out.
       Coordinates sit on the 0.5 pt (@2x pixel) grid so the cut-out stays crisp. -->
  <defs>
    <mask id="prompt" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#FFFFFF"/>
      <path d="M9 6.5 L11.5 9 L9 11.5" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="12" y="10.5" width="2.75" height="1.5" rx="0.75" fill="#000000"/>
    </mask>
  </defs>
  <rect x="1.75" y="3.25" width="14.5" height="11.5" rx="2.75" fill="none" stroke="#000000" stroke-width="1.5"/>
  <rect x="7" y="3.25" width="9.25" height="11.5" rx="2.25" fill="#000000" mask="url(#prompt)"/>
</svg>
