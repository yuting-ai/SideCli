<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1620"/>
      <stop offset="100%" stop-color="#090f16"/>
    </linearGradient>
    <linearGradient id="barG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#47ddf5"/>
      <stop offset="100%" stop-color="#38b8d8"/>
    </linearGradient>
    <linearGradient id="shineG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.065"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ic">
      <rect x="0" y="0" width="400" height="400" rx="88" ry="88"/>
    </clipPath>
  </defs>

  <!-- Icon body -->
  <rect x="0" y="0" width="400" height="400" rx="88" ry="88" fill="url(#bgG)"/>

  <!-- Top gloss -->
  <rect x="0" y="0" width="400" height="220" rx="88" ry="88" fill="url(#shineG)" clip-path="url(#ic)"/>

  <!-- Blue vertical bar: left=15.6%, top=15.6%, bottom=80%, width~4.5% -->
  <rect x="62" y="62" width="18" height="258" rx="9" fill="url(#barG)"/>

  <!-- Teal chevron ">": top-left=(124,133) tip=(196,187) bot-left=(124,240) -->
  <polyline
    points="124,133 196,187 124,240"
    fill="none"
    stroke="#3dd9c0"
    stroke-width="16"
    stroke-linecap="square"
    stroke-linejoin="miter"
    stroke-miterlimit="20"/>

  <!-- Teal cursor bar: x=222, y=249, width=62 -->
  <rect x="222" y="242" width="62" height="14" rx="0" fill="#3dd9c0"/>
</svg>
